syntax = "proto3";

package api.user_v1;

import "validate/validate.proto";

option go_package = "github.com/go-park-mail-ru/2025_1_Quza/auth/internal/transport/grpc/proto/user_v1;user_v1";


enum Role {
  ROLE_UNSPECIFIED = 0;
  USER = 1;
  ADMIN = 2;
}

message User {
  string name = 1 [(validate.rules).string = {min_len: 1, max_len: 255}];
  string email = 2 [(validate.rules).string.email = true];
  Role role = 3 [(validate.rules).enum.defined_only = true];
}